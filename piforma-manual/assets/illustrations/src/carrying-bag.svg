<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560">
<g stroke="#222" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
<!-- ground shadow -->
<ellipse cx="270" cy="520" rx="200" ry="22" fill="#d9d8d3" stroke="none"/>
<!-- body of the bag -->
<path d="M96 150 C92 260 88 400 92 486 C150 510 380 510 438 486 C442 400 438 260 434 150 Z" fill="#fff"/>
<!-- side shading -->
<path d="M400 152 C404 260 408 400 404 492 C420 490 432 488 438 486 C442 400 438 260 434 150 Z" fill="#e9e8e4" stroke="none"/>
<path d="M434 150 C438 260 442 400 438 486" fill="none"/>
<!-- bottom seam -->
<path d="M100 466 C170 486 360 486 430 466" fill="none" stroke-width="1.6" stroke-dasharray="6 6"/>
<!-- gathered top -->
<path d="M96 150 C150 128 380 128 434 150 C420 132 400 112 380 104 C320 92 210 92 150 104 C128 112 108 132 96 150 Z" fill="#fff"/>
<path d="M170 104 C176 120 182 132 186 142 M265 96 V136 M360 104 C354 120 348 132 344 142" fill="none" stroke-width="1.5"/>
<!-- four grommets -->
<g fill="#fff"><circle cx="150" cy="150" r="11"/><circle cx="230" cy="142" r="11"/><circle cx="310" cy="142" r="11"/><circle cx="390" cy="150" r="11"/></g>
<g fill="#222" stroke="none"><circle cx="150" cy="150" r="5"/><circle cx="230" cy="142" r="5"/><circle cx="310" cy="142" r="5"/><circle cx="390" cy="150" r="5"/></g>
<!-- strap loop through the grommets -->
<path d="M150 150 C170 162 210 156 230 142 C250 156 290 156 310 142 C330 156 370 162 390 150" fill="none" stroke-width="5"/>
<path d="M150 150 C170 162 210 156 230 142 C250 156 290 156 310 142 C330 156 370 162 390 150" fill="none" stroke="#fff" stroke-width="2"/>
<!-- strap down the front to the clasp -->
<path d="M252 160 L250 250 L282 250 L280 160 Z" fill="#fff"/>
<path d="M256 168 V244 M276 168 V244" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
<!-- clasp -->
<rect x="238" y="246" width="56" height="40" rx="6" fill="#e9e8e4"/>
<rect x="252" y="256" width="28" height="20" rx="3" fill="#fff"/>
<!-- carrying handle on the side -->
<path d="M434 210 C478 214 482 300 438 306" fill="none" stroke-width="10"/>
<path d="M434 210 C478 214 482 300 438 306" fill="none" stroke="#fff" stroke-width="5"/>
<!-- canvas seams -->
<path d="M120 200 C118 300 116 380 118 450" fill="none" stroke-width="1.4"/>
<path d="M410 200 C412 300 414 380 412 450" fill="none" stroke-width="1.4"/>
</g>
</svg>
